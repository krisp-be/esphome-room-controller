# Core configuration of the room controller board (Arduino Nano ESP32 on controller board v2).
# Include this once, first, in every device config:
#
#   substitutions:
#     name: laundry-room
#     friendly_name: Laundry room
#   packages:
#     board: !include ../common/board.yaml
#
# Needs a secrets.yaml next to the device config (see examples/secrets.yaml.example).
# Pin map: see hardware/controller-board/README.md.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: krisp-be.esphome-room-controller
    version: "1.0"

esp32:
  board: arduino_nano_esp32
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

# Works without Home Assistant: all logic runs on the board, settings via the web page.
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the Wi-Fi network is gone (new router, new owner) the board opens its own access point.
  # Connect to it with a phone and enter the new network on the page that opens.
  ap:
    ssid: ${name}-setup
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3

# I²C bus: MCP23017 I/O expander on the board, plus external sensors on the I2C terminal.
i2c:
  id: bus_i2c
  sda: GPIO11
  scl: GPIO12
  frequency: 100kHz
  scan: true

# MCP23017: header IO A (A0..A7) and IO B (B0..B2); B3..B7 are used by the 433 MHz receiver socket.
mcp23017:
  - id: expander
    address: 0x20

status_led:
  pin: GPIO48

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome version
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: IP address
      entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: config
